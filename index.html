<html lang="en">

<style>
@font-face{font-family:'Fragment Mono';src:url("fonts/FragmentMono-latin.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:'Druk Wide Bold';src:url("fonts/DrukWideBold.woff2") format("woff2");font-weight:700;font-display:swap}
:root{--bg:#020508;--fg:#fff;--display:'Druk Wide Bold','Druk Wide Trial','Druk Wide','Archivo Black',Impact,sans-serif;--mono:'Fragment Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font:15px/1 var(--mono);text-transform:uppercase;overflow:hidden}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}
#hero{position:fixed;inset:0;z-index:0}
.layer{position:absolute;inset:0;overflow:hidden;background-size:cover}
.layer video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.layer::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.5); /* Adjust opacity between 0.1 and 0.9 */
  pointer-events: none;
}



main{position:relative;z-index:5;display:flex;flex-direction:column;height:100vh;height:100dvh;padding:160px 8px 48px}
/* the list scrolls on its own when the screen is too short for all 15 rows */
#list{position:relative;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}#list::-webkit-scrollbar{display:none}
:root{--cols:159px 478px minmax(0,1fr);--rw:clamp(200px,24vw,346px)}
.row{position:relative;display:grid;grid-template-columns:var(--cols);flex:none;height:37px;align-items:center;padding:0 7px;cursor:pointer;width:942px;max-width:100%;isolation:isolate}
.row.head{cursor:default;height:26px;margin-bottom:11px}
.row .fill{position:absolute;left:0;right:0;top:50%;height:22px;margin-top:-11px;background:#fff;clip-path:inset(0 100% 0 0);z-index:-1}
.row .ink{position:absolute;inset:0;display:grid;grid-template-columns:var(--cols);align-items:center;padding:0 7px;color:#000;clip-path:inset(0 100% 0 0);pointer-events:none}
.row span{position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:12px;transition:color .01s,transform .5s cubic-bezier(.16,1,.3,1)}
/* hover: push the row's text right (the black .ink copy moves too, so it stays aligned over the white fill) */
@media(hover:hover){.row:not(.head):hover span{transform:translateX(10px)}}

footer{position:fixed;left:15px;bottom:14px;z-index:10;display:flex;gap:80px;mix-blend-mode:difference}
#reel{display:block;position:fixed;right:15px;bottom:15px;width:var(--rw);z-index:10;background:#fff;color:#000;padding:7px;cursor:pointer}
#reel .t{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:15px;padding-bottom:5px}
#reel .t i{width:6px;height:6px;border-radius:50%;background:#000}
#reel .v{position:relative;aspect-ratio:16/9;overflow:hidden;background:#0a1a24;background-size:cover}
#reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#reel .cap{display: none;position:absolute;left:0;right:0;bottom:0;padding:8px 10px;font-family:var(--display);color:#e8d7b8;font-size:28px;line-height:.9}
#wipe{position:fixed;inset:0;background:#fff;mix-blend-mode:difference;z-index:50;transform:translateY(100%);pointer-events:none}
@media(max-width:1280px){:root{--cols:80px minmax(0,1.3fr) minmax(0,1fr)}}
/* landscape screens: keep the rows clear of the reel card in the corner */
@media(min-aspect-ratio:1/1){.row{max-width:calc(100% - var(--rw) - 24px)}}
@media(max-width:900px){:root{--cols:64px minmax(0,1.2fr) minmax(0,1fr);--rw:220px}main{padding-top:120px}footer{gap:24px}}
/* phone: year + title only (industry hidden), reel card hidden: the background already shows the project */
@media(max-width:600px){:root{--cols:52px minmax(0,1fr)}.row>span:nth-of-type(3),.row .ink span:nth-of-type(3){display:none}main{padding:100px 4px 48px}.row{height:34px;max-width:100%}#reel{display:none}footer{left:12px;gap:20px}}
/* short landscape screens (phones on their side) */
@media(max-height:520px){main{padding-top:64px;padding-bottom:40px}.row{height:30px;max-width:100%}.row.head{height:22px;margin-bottom:2px}#reel{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- theme: F/2.4 = dark (default), F/1.4 = light. Light inverts the whole page, then flips photos and video back ---- */
html[data-theme="light"]{filter:invert(1) hue-rotate(180deg)}
html[data-theme="light"] img,html[data-theme="light"] video{filter:invert(1) hue-rotate(180deg)}
/* home: everything sits on the full-screen video, so the dark scrim, the list and the reel card keep their dark-theme look (only the header follows the theme) */
html[data-theme="light"] .layer::after,html[data-theme="light"] main,html[data-theme="light"] #reel{filter:invert(1) hue-rotate(180deg)}
/* the card is already flipped back as a whole, so its video must not be flipped a second time */
html[data-theme="light"] #reel video{filter:none}
/* ---- shared navbar (same on every page) ---- */
header{position:fixed;top:0;left:0;right:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding:calc(22px + env(safe-area-inset-top,0px)) max(15px,env(safe-area-inset-right,0px)) 22px max(15px,env(safe-area-inset-left,0px));mix-blend-mode:difference;color:#fff;pointer-events:none;font:13px/1.3 var(--mono);text-transform:uppercase}
header a,header span,header button{pointer-events:auto}
.hl{display:flex;gap:clamp(24px,3.5vw,56px);white-space:nowrap}.hr{display:flex;justify-content:flex-end;gap:clamp(24px,5vw,96px);white-space:nowrap}
.name{font-family:var(--display);font-size:28px;line-height:.9;margin:-4px 0;text-align:center;white-space:nowrap}
.name .reg{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:.62em;line-height:0;vertical-align:.75em;margin-left:.18em}
header .fs,header .tb{white-space:nowrap;background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;text-transform:inherit;cursor:pointer}
@media(max-width:1300px){.hl span:nth-child(2){display:none}}
/* tablet / phone landscape: one row, name left, links right */
@media(max-width:1024px){header{display:flex;align-items:baseline;gap:20px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:16px}.name{order:-1;margin:0 auto 0 0;text-align:left;font-size:20px}.hl span{display:none}.hl,.hr{gap:20px}}
/* phone: name (+ fullscreen) on the first row, the four links spread across the second */
@media(max-width:600px){header{flex-wrap:wrap;justify-content:space-between;row-gap:10px;column-gap:0;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:14px;font-size:12px}.name{flex:1 1 calc(100% - 40px);font-size:18px}.hr{display:contents}header .fs{order:-1}}
img,video{-webkit-user-drag:none;user-select:none}
</style>
</head>

<script src="vendor/gsap.min.js"></script>
<script>
// Put a video URL/path in `video` for each project (mp4). Gradients are fallbacks.
const V=[ // themed Mixkit stock clips, one per project (720p, 360p fallback). Replace with your own mp4 paths.
  ["https://assets.mixkit.co/videos/49642/49642-720.mp4", "https://assets.mixkit.co/videos/49642/49642-360.mp4"],
  ["https://assets.mixkit.co/videos/101368/101368-720.mp4", "https://assets.mixkit.co/videos/101368/101368-360.mp4"],
  ["https://assets.mixkit.co/videos/35540/35540-720.mp4", "https://assets.mixkit.co/videos/35540/35540-360.mp4"],
  ["https://assets.mixkit.co/videos/18312/18312-720.mp4", "https://assets.mixkit.co/videos/18312/18312-360.mp4"],
  ["https://assets.mixkit.co/videos/34400/34400-720.mp4", "https://assets.mixkit.co/videos/34400/34400-360.mp4"],
  ["https://assets.mixkit.co/videos/51295/51295-720.mp4", "https://assets.mixkit.co/videos/51295/51295-360.mp4"],
  ["https://assets.mixkit.co/videos/20766/20766-720.mp4", "https://assets.mixkit.co/videos/20766/20766-360.mp4"],
  ["https://assets.mixkit.co/videos/4348/4348-720.mp4", "https://assets.mixkit.co/videos/4348/4348-360.mp4"],
  ["https://assets.mixkit.co/videos/7125/7125-720.mp4", "https://assets.mixkit.co/videos/7125/7125-360.mp4"],
  ["https://assets.mixkit.co/videos/42840/42840-720.mp4", "https://assets.mixkit.co/videos/42840/42840-360.mp4"],
  ["https://assets.mixkit.co/videos/30416/30416-720.mp4", "https://assets.mixkit.co/videos/30416/30416-360.mp4"],
  ["https://assets.mixkit.co/videos/48507/48507-720.mp4", "https://assets.mixkit.co/videos/48507/48507-360.mp4"],
  ["https://assets.mixkit.co/videos/151/151-720.mp4", "https://assets.mixkit.co/videos/151/151-360.mp4"],
  ["https://assets.mixkit.co/videos/2074/2074-720.mp4", "https://assets.mixkit.co/videos/2074/2074-360.mp4"],
  ["https://assets.mixkit.co/videos/4244/4244-720.mp4", "https://assets.mixkit.co/videos/4244/4244-360.mp4"]
];
const P=[
["2026","Numero Netherlands x Normani","Editorial / Publishing","#0d3550,#c9772f"],
["2026","Converse x Billie Eilish","Fashion & Footwear","#1b1b1b,#3d7a3a"],
["2026","Genesis","Automotive","#0a0f14,#7a5b3a"],
["2026","Culligan","Consumer Goods & Water Technology","#08324d,#5fb4d6"],
["2025","Nylon France","Editorial / Media","#2a1030,#d04b7a"],
["2025","Katseye x InStyle","Entertainment / Editorial","#301a10,#e0a060"],
["2025","Eilish No.3","Fragrance & Beauty","#10251a,#9ad0a0"],
["2024","Your Turn","Film & Commercial","#1a1a30,#5a6ad0"],
["2024","Guest in Residence","Luxury Apparel & Fashion","#2b2620,#cbbd9e"],
["2024","YSL x Lenny Kravitz","Entertainment / Streaming","#100c0c,#a02020"],
["2024","Netflix - The Mother","Entertainment / Television","#0c1420,#c03030"],
["2024","GQ x MGK x Megan Fox","Editorial / Publishing","#201010,#d08030"],
["2023","Gentlemans Journal","Editorial / Publishing","#1c2218,#8a9a60"],
["2023","InStyle Mexico","Film & Commercial","#301020,#f0a040"],
["2023","Rockin' Eve","Automotive","#050a10,#3070a0"]
].map((a,i)=>({year:a[0],title:a[1],ind:a[2],c:a[3].split(","),video:V[i]}));

const F=["01-numero-netherlands-x-normani/index.html", "02-converse-x-billie-eilish/index.html", "03-genesis/index.html", "04-culligan/index.html", "05-nylon-france/index.html", "06-katseye-x-instyle/index.html", "07-eilish-no-3/index.html", "08-your-turn/index.html", "09-guest-in-residence/index.html", "10-ysl-x-lenny-kravitz/index.html", "11-netflix-the-mother/index.html", "12-gq-x-mgk-x-megan-fox/index.html", "13-gentlemans-journal/index.html", "14-instyle-mexico/index.html", "15-rockin-eve/index.html"];
const list=document.getElementById('list'),hero=document.getElementById('hero'),rv=document.getElementById('rv');
// page transition overlay: always driven by yPercent (100 = below screen, 0 = covering, -100 = above)
gsap.set('#wipe',{y:0,yPercent:100});
const wipeIn=href=>{try{sessionStorage.setItem('wipe','1')}catch(x){}gsap.to('#wipe',{yPercent:0,duration:.7,ease:'expo.inOut',onComplete:()=>{location.href=href}})};
const wipeOut=(delay=0)=>gsap.to('#wipe',{yPercent:-100,duration:.8,ease:'expo.inOut',delay,onComplete:()=>gsap.set('#wipe',{yPercent:100})});

const rt=document.getElementById('rt'),rc=document.getElementById('rc'),reel=document.getElementById('reel');
const bg=p=>`linear-gradient(135deg,${p.c[0]},${p.c[1]} 140%)`;
// Data Saver / slow connections get the 360p clip first
const SLOW=(c=>c&&(c.saveData||/2g|3g/.test(c.effectiveType||'')))(navigator.connection);
function media(p,small){
  if(!p.video)return null;
  const src=small?[p.video[1]]:SLOW?[...p.video].reverse():p.video;
  const v=document.createElement('video');
  Object.assign(v,{muted:true,loop:true,playsInline:true,autoplay:true});
  // several <source>s: the browser falls through to the next one if a URL fails
  src.forEach(u=>{const s=document.createElement('source');s.src=u;s.type='video/mp4';v.appendChild(s);});
  v.play&&v.play().catch(()=>{});return v;
}
function layer(p){
  const d=document.createElement('div');d.className='layer';d.style.background=bg(p);
  const v=media(p);if(v)d.prepend(v);return d;
}
P.forEach((p,i)=>{
  const r=document.createElement('a');r.className='row';r.href='project/'+F[i];
  r.innerHTML=`<i class="fill"></i><span>${p.year}</span><span>${p.title}</span><span>${p.ind}</span><div class="ink"><span>${p.year}</span><span>${p.title}</span><span>${p.ind}</span></div>`;
  // click previews (as before); double-click / Enter opens the project; ctrl/cmd/middle-click opens a new tab natively
  r.onclick=e=>{if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button)return;e.preventDefault();select(i)};
  r.ondblclick=()=>wipeIn(r.href);
  r.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();wipeIn(r.href)}};
  list.appendChild(r);
});
const rows=[...list.children];let cur=-1,busy=false,prog=null,lastNav=0;const DUR=10;
const next=d=>select((cur+d+P.length)%P.length);

function setReel(p){
  rt.textContent=p.title;rc.textContent=i2(p);
  rv.style.background=bg(p);
  rv.querySelector('video')?.remove();
  if(getComputedStyle(reel).display==='none')return; // phones: the card is hidden, so don't download its video
  const v=media(p,true);if(v)rv.prepend(v); // the card is small: 360p is plenty
}
const i2=p=>p.ind.split('/')[0].trim();

function select(i){
  if(i===cur||busy)return;busy=true;const p=P[i],prev=cur;cur=i;reel.href='project/'+F[i];
  // fill: previous row resets, new row auto-fills left → right, then advances
  if(prev>-1){rows[prev].classList.remove('on');gsap.set(rows[prev].querySelectorAll('.fill,.ink'),{clipPath:'inset(0 100% 0 0)'});}
  rows[i].classList.add('on');
  {const r=rows[i];if(r.offsetTop<list.scrollTop||r.offsetTop+r.offsetHeight>list.scrollTop+list.clientHeight)list.scrollTo({top:r.offsetTop-(list.clientHeight-r.offsetHeight)/2,behavior:'smooth'});}
  prog&&prog.kill();
  prog=gsap.fromTo(rows[i].querySelectorAll('.fill,.ink'),{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)',duration:DUR,ease:'none',onComplete:()=>next(1)});
  // hero: new layer swipes bottom → top
  const l=layer(p);hero.appendChild(l);
  if(prev===-1){gsap.set(l,{clipPath:'inset(0% 0 0 0)'});busy=false;setReel(p);return;}
  gsap.fromTo(l,{clipPath:'inset(100% 0 0 0)'},{clipPath:'inset(0% 0 0 0)',duration:1.1,ease:'expo.inOut',onComplete:()=>{
    [...hero.children].slice(0,-1).forEach(e=>e.remove());busy=false;}});
  gsap.fromTo('#reel .v',{clipPath:'inset(100% 0 0 0)'},{clipPath:'inset(0% 0 0 0)',duration:.9,ease:'expo.inOut',delay:.15,onStart:()=>setReel(p)});
  gsap.fromTo('#rt',{yPercent:100,opacity:0},{yPercent:0,opacity:1,duration:.6,ease:'power3.out',delay:.3});
}

// scroll / swipe swaps project (down = next, up = previous), loops
const inList=e=>e.target.closest&&e.target.closest("#list")&&list.scrollHeight>list.clientHeight+2;
function nav(d){const t=Date.now();if(t-lastNav<900||busy)return;lastNav=t;next(d);}
addEventListener('wheel',e=>{if(inList(e))return;if(Math.abs(e.deltaY)>4)nav(e.deltaY>0?1:-1);},{passive:true});
let ty=0,tl=false;addEventListener('touchstart',e=>{ty=e.touches[0].clientY;tl=inList(e)},{passive:true});
addEventListener('touchend',e=>{if(tl)return;const d=ty-e.changedTouches[0].clientY;if(Math.abs(d)>40)nav(d>0?1:-1);},{passive:true});
addEventListener('keydown',e=>{if(e.key==='ArrowDown')nav(1);if(e.key==='ArrowUp')nav(-1);});

// intro
select(0);
gsap.from('.row',{opacity:0,y:12,stagger:.03,duration:.6,ease:'power2.out',delay:.2});
gsap.from('#reel',{y:40,opacity:0,duration:.8,ease:'power3.out',delay:.5});

// Phnom Penh clock
function tick(){try{document.getElementById('clock').textContent='Phnom Penh, (CAM) '+new Date().toLocaleTimeString('en-US',{timeZone:'Asia/Phnom_Penh',hour:'numeric',minute:'2-digit'});}catch(e){}}
tick();setInterval(tick,20000);

// page transition between real pages (wipe cover → load → wipe reveal)
document.addEventListener('click',e=>{
  const a=e.target.closest('a[data-go]');if(!a||a.classList.contains('row'))return;
  if(e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return; // new tab/window: browser default
  const u=new URL(a.href,location.href);
  if(u.pathname===location.pathname&&u.search===location.search){if(!u.hash)e.preventDefault();return} // already here: no wipe
  e.preventDefault();wipeIn(a.href);
});
try{if(sessionStorage.getItem('wipe')){sessionStorage.removeItem('wipe');gsap.set('#wipe',{yPercent:0});wipeOut(.1)}}catch(e){}
// back/forward cache restores the page as it was left (overlay still covering) -> reveal it
addEventListener('pageshow',e=>{if(e.persisted&&gsap.getProperty('#wipe','yPercent')===0)wipeOut()});
</script>
